include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml
stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

deploy-gatus-dev:
  variables:
    kube_config: KubeConfig_Raypro_dev
    namespace: dev
    domain: dev-gatus.rpgp.cc
    gatus_url: https://dev-gatus.rpgp.cc/ 
  environment:
    name: gatus-dev
  stage: deploy-dev
  only:
    - main
  when: manual
  script:
    - bash convert_to_config.sh $namespace services-$namespace.csv $gatus_url
    - helm template gatus . --set-file config=config-$namespace.yaml --set ingress.enabled=true --set ingress.hosts[0]=$domain -f values.yaml -n $namespace | kubectl apply -f -

deploy-gatus-staging:
  variables:
    kube_config: KubeConfig_Raypro_staging
    namespace: staging
    domain: staging-gatus.rpgp.cc
    gatus_url: https://staging-gatus.rpgp.cc/ 
  environment:
    name: gatus-prod
  stage: deploy-staging
  needs: 
    - deploy-gatus-dev
  only:
    - main
  when: manual
  script:
    - bash convert_to_config.sh $namespace services-$namespace.csv $gatus_url
    - helm template gatus . --set-file config=config-$namespace.yaml --set ingress.enabled=true --set ingress.hosts[0]=$domain -f values.yaml -n $namespace | kubectl apply -f -


deploy-gatus-prod:
  variables:
    kube_config: KubeConfig_Raypro_prod
    namespace: prod
    domain: healthcheck.srvptt.com
    gatus_url: https://healthcheck.srvptt.com/ 
  environment:
    name: gatus-prod
  stage: deploy-prod
  needs: 
    - deploy-gatus-staging
  only:
    - main
  when: manual
  script:
    - bash convert_to_config.sh $namespace services-$namespace.csv $gatus_url
    - helm template gatus . --set-file config=config-$namespace.yaml --set ingress.enabled=true --set ingress.hosts[0]=$domain -f values.yaml -n $namespace | kubectl apply -f -

