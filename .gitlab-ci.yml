include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gatus-job-templates.yml
stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

.convert_to_config: &convert_to_config
    - bash convert_to_config.sh $namespace services-$namespace.csv $gatus_url

deploy-gatus-dev:
  extends: .deploy-gatus
  variables:
    kube_config: KubeConfig_Raypro_dev
    namespace: dev
    domain: dev-gatus.rpgp.cc
    gatus_url: https://dev-gatus.rpgp.cc/ 
  environment:
    name: gatus-dev
  stage: deploy-dev
  script:
    - *convert_to_config
    - !reference [.deploy-gatus, script]

deploy-gatus-staging:
  extends: .deploy-gatus
  variables:
    kube_config: KubeConfig_Raypro_staging
    namespace: staging
    domain: stg-gatus.rpgp.cc
    gatus_url: https://stg-gatus.rpgp.cc/ 
  environment:
    name: gatus-staging
  stage: deploy-staging
  script:
    - *convert_to_config
    - !reference [.deploy-gatus, script]

deploy-gatus-prod:
  extends: .deploy-gatus
  variables:
    kube_config: KubeConfig_Raypro_prod
    namespace: prod
    domain: healthcheck.srvptt.com
    gatus_url: https://healthcheck.srvptt.com/ 
  environment:
    name: gatus-prod
  stage: deploy-prod
  script:
    - *convert_to_config
    - !reference [.deploy-gatus, script]
